<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk — PasarLokal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        primary: { DEFAULT: '#16a34a', dark: '#15803d', light: '#dcfce7' },
        accent:  { DEFAULT: '#f97316', dark: '#ea580c' }
      }}}
    }
  </script>
</head>
<body class="bg-gray-50 font-sans antialiased min-h-screen flex flex-col">

  <div id="navbar"></div>

  <!-- Breadcrumb -->
  <div class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <nav class="flex items-center gap-2 text-sm text-gray-400">
        <a href="../index.html" class="hover:text-green-600 transition-colors">Beranda</a>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <a href="catalog.html" class="hover:text-green-600 transition-colors">Katalog</a>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span id="breadcrumb-name" class="text-gray-700 font-medium truncate max-w-xs">Memuat...</span>
      </nav>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">

    <!-- Skeleton loading -->
    <div id="product-skeleton" class="grid grid-cols-1 lg:grid-cols-2 gap-10">
      <div class="aspect-square bg-gray-200 rounded-3xl animate-pulse"></div>
      <div class="space-y-4">
        <div class="h-6 bg-gray-200 rounded-lg animate-pulse w-1/3"></div>
        <div class="h-10 bg-gray-200 rounded-lg animate-pulse w-3/4"></div>
        <div class="h-8 bg-gray-200 rounded-lg animate-pulse w-1/2"></div>
        <div class="h-32 bg-gray-200 rounded-xl animate-pulse"></div>
        <div class="h-12 bg-gray-200 rounded-xl animate-pulse"></div>
        <div class="h-12 bg-gray-200 rounded-xl animate-pulse"></div>
      </div>
    </div>

    <!-- Product detail (hidden until loaded) -->
    <div id="product-detail" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

        <!-- Image -->
        <div class="space-y-4">
          <div class="aspect-square bg-gradient-to-br from-green-50 to-emerald-100 rounded-3xl overflow-hidden flex items-center justify-center shadow-sm">
            <img id="product-image" src="" alt=""
              class="w-full h-full object-cover"
              onerror="this.style.display='none';document.getElementById('product-emoji').style.display='flex'" />
            <div id="product-emoji" class="hidden w-full h-full items-center justify-center text-9xl"></div>
          </div>
        </div>

        <!-- Info -->
        <div class="space-y-5">
          <!-- Category + badges -->
          <div class="flex items-center gap-2 flex-wrap">
            <span id="product-category"
              class="bg-green-100 text-green-700 text-xs font-semibold px-3 py-1 rounded-full"></span>
            <span id="product-stock-badge" class="text-xs font-semibold px-3 py-1 rounded-full"></span>
          </div>

          <!-- Name -->
          <h1 id="product-name" class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight"></h1>

          <!-- Price -->
          <div id="product-price" class="text-3xl font-extrabold text-green-600"></div>

          <!-- Seller info -->
          <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-2xl border border-gray-100">
            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-700 font-bold text-sm flex-shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-gray-400">Dijual oleh</p>
              <p id="seller-name" class="font-semibold text-gray-900 text-sm"></p>
            </div>
            <div class="ml-auto flex items-center gap-1 text-yellow-400 text-sm">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              <span class="text-gray-600 font-medium">4.8</span>
            </div>
          </div>

          <!-- Description -->
          <div>
            <h3 class="font-semibold text-gray-900 mb-2">Deskripsi Produk</h3>
            <p id="product-description" class="text-gray-600 text-sm leading-relaxed"></p>
          </div>

          <!-- Stock info -->
          <div class="flex items-center gap-3 text-sm">
            <div class="flex items-center gap-1.5 text-gray-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
              </svg>
              Stok tersedia:
            </div>
            <span id="product-stock" class="font-bold text-gray-900"></span>
          </div>

          <!-- Quantity selector -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Jumlah</label>
            <div class="flex items-center gap-3">
              <div class="flex items-center border border-gray-200 rounded-xl overflow-hidden bg-white">
                <button id="qty-minus"
                  class="w-11 h-11 flex items-center justify-center text-gray-500 hover:bg-gray-50 active:bg-gray-100 transition-colors text-lg font-bold">−</button>
                <input type="number" id="qty-input" value="1" min="1"
                  class="w-14 h-11 text-center text-sm font-bold text-gray-900 border-0 focus:ring-0 bg-white" />
                <button id="qty-plus"
                  class="w-11 h-11 flex items-center justify-center text-gray-500 hover:bg-gray-50 active:bg-gray-100 transition-colors text-lg font-bold">+</button>
              </div>
              <span id="subtotal-price" class="text-base font-bold text-green-600"></span>
            </div>
          </div>

          <!-- CTA Buttons -->
          <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button id="btn-cart"
              class="flex-1 flex items-center justify-center gap-2 bg-white border-2 border-green-600 text-green-600 hover:bg-green-50 font-semibold py-3.5 rounded-xl transition-all duration-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
              </svg>
              Keranjang
            </button>
            <button id="btn-buy"
              class="flex-1 flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-3.5 rounded-xl transition-all duration-200 shadow-sm hover:shadow-md hover:shadow-green-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
              Beli Sekarang
            </button>
          </div>

          <!-- Trust badges -->
          <div class="grid grid-cols-3 gap-3 pt-2 border-t border-gray-100">
            <div class="text-center">
              <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center mx-auto mb-1">
                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
              </div>
              <p class="text-xs text-gray-500 leading-tight">Pembayaran<br/>Aman</p>
            </div>
            <div class="text-center">
              <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center mx-auto mb-1">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
              </div>
              <p class="text-xs text-gray-500 leading-tight">Pengiriman<br/>Terpercaya</p>
            </div>
            <div class="text-center">
              <div class="w-8 h-8 bg-orange-100 rounded-lg flex items-center justify-center mx-auto mb-1">
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
              </div>
              <p class="text-xs text-gray-500 leading-tight">Produk<br/>UMKM Asli</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Error state -->
    <div id="product-error" class="hidden flex flex-col items-center justify-center py-32 gap-4 text-gray-400">
      <span class="text-6xl">😕</span>
      <p class="text-xl font-bold text-gray-600">Produk tidak ditemukan</p>
      <a href="catalog.html" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-xl transition-colors">
        Kembali ke Katalog
      </a>
    </div>
  </div>

  <div id="footer"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script>
    utils.injectNavbar('catalog');
    utils.injectFooter();

    const DEMO_EMOJIS = { makanan:'🍱', kerajinan:'👜', fashion:'👗', elektronik:'📱', pertanian:'🌿', lainnya:'🎁' };
    const DEMO_PRODUCTS = {
      1: { id:1, name:'Kue Nastar Spesial', price:45000, category:'makanan', stock:50, image_url:null,
           description:'Nastar premium dengan isian selai nanas asli pilihan. Dibuat dengan mentega berkualitas, tekstur lembut di dalam, renyah di luar. Cocok untuk camilan sehari-hari dan hantaran.',
           seller:{ name:'Dapur Bu Sari', city:'Surabaya' } },
      2: { id:2, name:'Tas Anyaman Bambu', price:120000, category:'kerajinan', stock:15, image_url:null,
           description:'Tas anyaman bambu handmade dari pengrajin lokal Jawa Tengah. Ramah lingkungan, kuat, dan elegan. Cocok untuk belanja atau aktivitas outdoor.',
           seller:{ name:'Kerajinan Nusantara', city:'Solo' } },
      3: { id:3, name:'Teh Herbal Organik', price:35000, category:'pertanian', stock:100, image_url:null,
           description:'Teh herbal organik tanpa pestisida, dipetik langsung dari kebun sendiri di pegunungan Jawa. Kaya antioksidan, baik untuk kesehatan.',
           seller:{ name:'Kebun Sehat', city:'Malang' } },
    };

    const productId = utils.getQueryParam('id');
    let productData = null;

    async function loadProduct() {
      if (!productId) { showError(); return; }

      try {
        const res = await api.get(`/products/${productId}`);
        if (res.success && res.data) {
          renderProduct(res.data);
        } else {
          showError();
        }
      } catch (_) {
        const demo = DEMO_PRODUCTS[productId] || DEMO_PRODUCTS[1];
        renderProduct(demo);
      }
    }

    function renderProduct(p) {
      productData = p;
      document.getElementById('product-skeleton').classList.add('hidden');
      document.getElementById('product-detail').classList.remove('hidden');
      document.title = `${p.name} — PasarLokal`;

      document.getElementById('breadcrumb-name').textContent = p.name;
      document.getElementById('product-name').textContent = p.name;
      document.getElementById('product-price').textContent = utils.formatRupiah(p.price);
      document.getElementById('product-description').textContent = p.description || 'Tidak ada deskripsi tersedia.';
      document.getElementById('product-stock').textContent = `${p.stock} unit`;
      document.getElementById('product-category').textContent = utils.getCategoryLabel(p.category);
      document.getElementById('seller-name').textContent = p.seller?.name || 'UMKM Lokal';

      // Stock badge
      const stockBadge = document.getElementById('product-stock-badge');
      if (p.stock === 0) {
        stockBadge.textContent = 'Habis';
        stockBadge.className = 'bg-red-100 text-red-600 text-xs font-semibold px-3 py-1 rounded-full';
      } else if (p.stock < 5) {
        stockBadge.textContent = 'Hampir Habis';
        stockBadge.className = 'bg-orange-100 text-orange-600 text-xs font-semibold px-3 py-1 rounded-full';
      } else {
        stockBadge.textContent = 'Tersedia';
        stockBadge.className = 'bg-green-100 text-green-600 text-xs font-semibold px-3 py-1 rounded-full';
      }

      // Image
      const img = document.getElementById('product-image');
      const emojiEl = document.getElementById('product-emoji');
      if (p.image_url) {
        img.src = utils.getProductImageUrl(p.image_url);
        img.alt = p.name;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
        emojiEl.style.display = 'flex';
        emojiEl.textContent = DEMO_EMOJIS[p.category] || '📦';
      }

      // Disable if out of stock
      if (p.stock === 0) {
        document.getElementById('btn-cart').disabled = true;
        document.getElementById('btn-buy').disabled = true;
        document.getElementById('btn-cart').classList.add('opacity-50', 'cursor-not-allowed');
        document.getElementById('btn-buy').classList.add('opacity-50', 'cursor-not-allowed');
      }

      updateSubtotal();
    }

    function showError() {
      document.getElementById('product-skeleton').classList.add('hidden');
      document.getElementById('product-error').classList.remove('hidden');
    }

    // Quantity controls
    const qtyInput = document.getElementById('qty-input');

    function updateSubtotal() {
      if (!productData) return;
      const qty = parseInt(qtyInput.value) || 1;
      document.getElementById('subtotal-price').textContent = utils.formatRupiah(productData.price * qty);
    }

    document.getElementById('qty-minus').addEventListener('click', () => {
      const val = parseInt(qtyInput.value) || 1;
      if (val > 1) { qtyInput.value = val - 1; updateSubtotal(); }
    });

    document.getElementById('qty-plus').addEventListener('click', () => {
      const val = parseInt(qtyInput.value) || 1;
      const max = productData?.stock || 99;
      if (val < max) { qtyInput.value = val + 1; updateSubtotal(); }
      else utils.showToast(`Stok hanya tersedia ${max} unit`, 'warning');
    });

    qtyInput.addEventListener('input', () => {
      let val = parseInt(qtyInput.value) || 1;
      const max = productData?.stock || 99;
      if (val < 1) val = 1;
      if (val > max) { val = max; utils.showToast(`Stok hanya tersedia ${max} unit`, 'warning'); }
      qtyInput.value = val;
      updateSubtotal();
    });

    // Add to cart
    document.getElementById('btn-cart').addEventListener('click', async () => {
      if (!auth.isLoggedIn()) {
        utils.showToast('Silakan login terlebih dahulu', 'warning');
        setTimeout(() => window.location.href = '../auth/login.html', 1000);
        return;
      }

      const qty = parseInt(qtyInput.value) || 1;
      try {
        const res = await api.post('/cart', { product_id: productData.id, quantity: qty });
        if (res.success) {
          utils.showToast('Produk berhasil ditambahkan ke keranjang! 🛒', 'success');
          utils.updateCartBadge();
        } else {
          utils.showToast(res.message || 'Gagal menambahkan ke keranjang', 'error');
        }
      } catch (_) {
        utils.showToast('Produk ditambahkan ke keranjang (demo)', 'success');
      }
    });

    // Buy now (add to cart then redirect)
    document.getElementById('btn-buy').addEventListener('click', async () => {
      if (!auth.isLoggedIn()) {
        utils.showToast('Silakan login terlebih dahulu', 'warning');
        setTimeout(() => window.location.href = '../auth/login.html', 1000);
        return;
      }

      const qty = parseInt(qtyInput.value) || 1;
      try {
        const res = await api.post('/cart', { product_id: productData.id, quantity: qty });
        const cartItemId = res.data?.id || res.cart_item?.id || res.id;
        if (cartItemId) {
          window.location.href = `/buyer/checkout.html?items=${cartItemId}`;
        } else {
          window.location.href = '/buyer/checkout.html';
        }
      } catch (_) {
        utils.showToast('Gagal menambahkan ke keranjang', 'error');
      }
    });

    loadProduct();
  </script>
</body>
</html>
